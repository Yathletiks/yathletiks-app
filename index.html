<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YATHLETIKS Coaching</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YATHLETIKS">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0B0B0B; --surface:#151515; --bar:#111111; --line:#262626; --line2:#3F3F3F;
  --fg:#FFFFFF; --muted:#A9A9A9; --accent:#1F5BFF; --on-accent:#FFFFFF; --accent-text:#8FAEFF;
  --inv-bg:#FFFFFF; --inv-fg:#0B0B0B; --field:#0B0B0B; --ok:#4CC38A; --warn:#F2B84B; --bad:#FF7B6B;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root.ya-light{
  --bg:#DCE6FF; --surface:#FFFFFF; --bar:#FFFFFF; --line:#C3D0F5; --line2:#8E9DCB;
  --fg:#0B0B0B; --muted:#4A4F5C; --accent:#1F5BFF; --on-accent:#FFFFFF; --accent-text:#1747D1;
  --inv-bg:#0B0B0B; --inv-fg:#FFFFFF; --field:#F4F7FF; --ok:#0F7A4A; --warn:#8A5A00; --bad:#B3261E;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;font-weight:500;line-height:1.5;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-weight:700;line-height:1.15;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:34px;height:32px;object-fit:contain}
.brand{flex:1}
.status{font-size:11px;font-weight:700;color:var(--muted);text-align:right;min-width:0}
.status.bad{color:var(--warn)}
.icon-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.sun{display:none}.ya-light .sun{display:block}.ya-light .moon{display:none}
main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
main>.wrap{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.up{color:var(--ok);font-weight:700;white-space:nowrap}
.down{color:var(--bad);font-weight:700;white-space:nowrap}
.eq{color:var(--muted);font-weight:700;white-space:nowrap}
.oktxt{color:var(--ok);font-weight:700}
.card.okcard{border-color:var(--ok)}
#bodyform{scroll-margin-top:150px}
.bodytbl td:first-child,.bodytbl th:first-child{white-space:nowrap}
.bodytbl td:last-child{padding-right:0}
.eyebrow{font-size:12px;font-weight:700;}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{font-size:13px;font-weight:700;color:var(--muted)}
.hero{background:var(--accent);color:var(--on-accent);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hero h2{font-size:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.dash{border-style:dashed;border-color:var(--line2)}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.title{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.navrow{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.btn{min-height:48px;border-radius:10px;border:0;padding:0 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.inv{background:var(--inv-bg);color:var(--inv-fg)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--fg)}
.btn.sm{min-height:44px;font-size:13px;padding:0 14px}
.btn.full{width:100%}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1 1 auto;padding:0 10px;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.blockbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.blockbar h2{font-size:13px;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:5px 12px}
.blockbar span{font-size:12px;font-weight:500;color:var(--muted)}
.ex h3{font-size:16px;overflow-wrap:anywhere}
.presc{font-size:14px;font-weight:700;color:var(--accent-text)}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;gap:8px}
.set .n{width:26px;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.set label{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);padding-left:34px;margin-top:-4px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;min-width:0;min-height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--field);color:var(--fg);padding:8px 10px;font-size:16px;font-weight:700}
.set input{text-align:center;padding:8px 4px}
textarea{font-weight:500;min-height:72px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.field output{color:var(--accent-text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:380px){.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.navwrap{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navwrap .wrap{padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs{display:flex}
.tabs button{flex:1;min-width:0;min-height:58px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;padding:0 2px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--accent-text);font-weight:700}
.tabs svg{width:20px;height:20px}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#0B0B0B;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ya-light .badge{color:#FFFFFF}
.msgs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:10px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bub .meta{display:block;font-size:11px;font-weight:600;opacity:.9;margin-top:4px}
.bub .ref{display:block;font-size:11px;font-weight:700;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .eyebrow{font-size:11px;}
.tile b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.navrow.okcard{border-color:var(--ok)}
#timer{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:20;width:92px;height:92px;border:0;border-radius:50%;padding:0;background:var(--inv-bg);color:var(--inv-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 4px 18px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
#timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#timer .ring-bg{fill:none;stroke:currentColor;opacity:.18;stroke-width:7}
#timer #timer-arc{fill:none;stroke:#1F5BFF;stroke-width:7;stroke-linecap:round;stroke-dasharray:213.6;stroke-dashoffset:0}
#timer .lab{font-size:10px;font-weight:700;opacity:.8;position:relative}
#timer #timer-t{font-size:22px;font-weight:700;line-height:1.1;position:relative}
#timer.done{background:var(--ok);color:#0B0B0B}
.ya-light #timer.done{color:#FFFFFF}
@media (prefers-reduced-motion:no-preference){#timer #timer-arc{transition:stroke-dashoffset .25s linear}}
.back{display:flex;align-items:center;gap:10px}
.back h1{font-size:20px;overflow-wrap:anywhere}
.check{color:var(--ok);flex:none}
.kcal{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.over>i{background:var(--warn)}
.macro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.macro div{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.macro b{font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 16px}
details>summary{min-height:52px;display:flex;align-items:center;font-weight:700;font-size:14px;cursor:pointer;list-style:none;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--accent-text)}
details[open]>summary::after{content:"–"}
details>.body{padding-bottom:16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
details .body h4{font-size:13px;font-weight:700;color:var(--accent-text);margin-top:4px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);}
.num td+td,.num th+th{white-space:nowrap}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px}
.msg{font-size:13px;font-weight:700}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.sel{user-select:all;-webkit-user-select:all;font-weight:700;color:var(--fg);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border:1px solid var(--line2);border-radius:999px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:220px}
#reader video{width:100%!important;display:block}
pre.bilan{margin:0;white-space:pre-wrap;font-family:var(--font);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.center{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s ease}}
.hello{display:flex;align-items:center;gap:12px}
.hello h1{font-size:22px}
.todo{gap:0}
.todo>h2{font-size:15px;padding-bottom:4px}
.trow{display:flex;align-items:center;gap:12px;padding-block:12px;border-top:1px solid var(--line);min-width:0}
.todo>h2+.trow{border-top:0}
.trow:last-child{padding-bottom:2px}
.trow b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center}
.dot.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.count{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.sprog{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.sgrid{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:8px;align-items:center}
.sgrid.c3{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr)}
.sgrid.d3{grid-template-columns:28px minmax(0,1fr) minmax(0,1.1fr)}
.sgrid.d2{grid-template-columns:28px minmax(0,1fr)}
.sgrid .hd{font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.sgrid .hd:first-child{text-align:left}
.sgrid .hd.r,.sgrid .pv{text-align:right}
.sgrid .n{font-size:15px;font-weight:700}
.sgrid .pv{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.sgrid input{text-align:center;padding:8px 4px}
.sgrid input.filled{border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.acc{color:var(--accent-text);border-color:var(--accent-text)}
#side{display:none}
body.coach #side{display:flex;gap:6px;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bar)}
#side .lab{display:none}
#side button{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none}
#side button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpis .tile b{font-size:26px}
.cgrid{display:flex;flex-direction:column;gap:18px}
.feed{gap:0;padding-block:6px}
.feed .frow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;min-width:0}
.feed .frow:first-child{border-top:0}
.feed .avatar{width:32px;height:32px;font-size:13px}
@media (min-width:900px){
  body.coach{padding-left:230px}
  body.coach #side{position:fixed;left:0;top:0;bottom:0;width:230px;flex-direction:column;align-items:stretch;padding:20px 12px;border-bottom:0;border-right:1px solid var(--line);z-index:12;overflow-x:visible}
  #side .lab{display:block;font-size:12px;font-weight:600;color:var(--muted);padding:0 14px 10px}
  #side .sp{flex:1}
  body.coach main>.wrap,body.coach .top .wrap{max-width:1080px;padding-left:28px;padding-right:28px}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  body.coach .narrow{max-width:620px}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <img class="logo" alt="Logo YA" src="icons/logo-b.png">
  <span class="brand"></span>
  <span class="status" id="status" role="status"></span>
  <button class="icon-btn" id="theme" type="button" aria-label="Changer de mode : sombre ou clair">
    <svg class="moon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    <svg class="sun" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
  </button>
</div>
</header>
<nav id="side" aria-label="Menu coach"><span class="lab">Espace coach</span><button type="button" data-act="cnav" data-v="dash">Tableau de bord</button><button type="button" data-act="cnav" data-v="list">Clients</button><button type="button" data-act="cnav" data-v="settings">Réglages</button><span class="sp"></span><button type="button" data-act="clogout">Déconnexion</button></nav>

<main><div class="wrap" id="main"><div class="center"><p class="muted">Chargement…</p></div></div></main>

<div class="navwrap" id="bottom" hidden><div class="wrap"><nav class="tabs" id="tabs" aria-label="Navigation"></nav></div></div>
<div id="cta" hidden></div>
<button type="button" id="timer" hidden aria-label="Chrono de repos. Toucher pour arrêter."><svg viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-bg" cx="40" cy="40" r="34"></circle><circle id="timer-arc" cx="40" cy="40" r="34"></circle></svg><span class="lab">Repos</span><span id="timer-t"></span></button>

<script src="vendor/supabase.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
